<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StopNBlock</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --accent: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #f28b82; }
    }
    :root[data-theme="dark"] { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #f28b82; }
    body { margin: 0; width: 280px; padding: 14px 16px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .version { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .shortcut { color: var(--muted); margin-bottom: 12px; }
    kbd { font-family: inherit; border: 1px solid var(--muted); border-radius: 4px; padding: 1px 5px; }
    button { width: 100%; padding: 8px; font: inherit; border: 0; border-radius: 4px;
      background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 10px; min-height: 1.4em; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>StopNBlock</h1>
  <div class="version" id="version">v?</div>
  <div class="shortcut" id="shortcut">Shortcut: …</div>
  <button id="start">Stop and block this ad</button>
  <div class="status" id="status"></div>
  <script src="debug.js"></script>
  <script src="popup.js"></script>
</body>
</html>
