<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StopNBlock</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --accent: #b3261e; --ok: #1e8e3e; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #f28b82; --ok: #81c995; }
    }
    :root[data-theme="dark"] { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; --accent: #f28b82; --ok: #81c995; }
    body { margin: 0; width: 280px; padding: 14px 16px; background: var(--bg); color: var(--fg);
      font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .version { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .shortcut { color: var(--muted); margin-top: 10px; }
    kbd { font-family: inherit; border: 1px solid var(--muted); border-radius: 4px; padding: 1px 5px; }
    button { width: 100%; padding: 8px; font: inherit; border: 0; border-radius: 4px;
      background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--muted); margin-top: 6px; }
    input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px; margin: 6px 0; font: inherit; }
    .status { margin-top: 10px; min-height: 1.4em; color: var(--muted); font-size: 12px; }
    .section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--muted); }
    .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
    a { color: var(--accent); }
    table { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--muted); vertical-align: top; }
    label { font-size: 13px; }
    .keyrow { display: flex; align-items: center; gap: 8px; }
    .keyrow button { flex: 1; margin-top: 0; }
    .led { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
    .led.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  </style>
</head>
<body>
  <h1>StopNBlock</h1>
  <div class="version" id="version">v?</div>
  <button id="start">Stop and block this ad</button>
  <div class="shortcut" id="shortcut"></div>
  <div class="status" id="status"></div>

  <div class="section">
    <div class="keyrow">
      <span class="led" id="led" title="AI key status"></span>
      <button class="secondary" id="setKey">Set AI Key</button>
    </div>
    <div class="note">
      Free key: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
    </div>
    <div id="keyForm" hidden>
      <input type="password" id="keyInput" placeholder="Paste your key here" autocomplete="off">
      <button id="saveKey">Save key</button>
    </div>
    <div class="note" id="keyStatus"></div>
  </div>

  <div class="section">
    <label><input type="checkbox" id="storeToggle"> Store in list</label>
    <button class="secondary" id="listButton">Blocked advertisements list</button>
    <div class="note">Privacy: List is on local storage, not shared with anyone.</div>
    <table id="list" hidden></table>
  </div>

  <script src="logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
